<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>QC Sandbox parity tests</title>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; margin: 16px; }
  .pass { color: #0a7a2f; } .fail { color: #c01818; font-weight: bold; }
</style>
<h1>QC Sandbox: JS port vs the Python core</h1>
<p>Reference fields come from <code>export_reference.py</code>. The code
under test is the post's own <code>qc-data</code> and <code>qc-core</code>
scripts, fetched from the post.</p>
<pre id="log"></pre>
<script>
"use strict";
const logEl = document.getElementById("log");
const results = [];
function log(s, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = s + "\n";
  logEl.appendChild(span);
}
function check(name, ok, detail) {
  results.push({ name, ok, detail });
  log(`${ok ? "PASS" : "FAIL"}  ${name}  ${detail}`, ok ? "pass" : "fail");
}
const maxAbs = (a, b) => {
  let m = 0;
  for (let i = 0; i < a.length; i++) m = Math.max(m, Math.abs(a[i] - b[i]));
  return m;
};

// Angles (degrees) of the local maxima of |rho_k|^2 within 0.08 of
// the ring |k| = kr, keeping those above 15 % of the ring's maximum.
function ringPeaks(QC, sim, kr) {
  const n = sim.n, re = Float64Array.from(sim.readField()), im = new Float64Array(n * n);
  QC.fft2cpu(re, im, n, false);
  const P = re.map((v, i) => v * v + im[i] * im[i]);
  P[0] = 0;
  const dk = 2 * Math.PI / (n * sim.dx), fk = (i) => (i <= n / 2 ? i : i - n);
  const cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (Math.abs(Math.hypot(fk(x) * dk, fk(y) * dk) - kr) <= 0.08) cells.push([x, y]);
  const top = Math.max(...cells.map(([x, y]) => P[y * n + x]));
  const out = [];
  for (const [x, y] of cells) {
    const v = P[y * n + x];
    if (v < 0.15 * top) continue;
    let max = true;
    for (let dy = -2; dy <= 2 && max; dy++) for (let dx = -2; dx <= 2; dx++)
      if ((dx || dy) && P[((y + dy + n) % n) * n + (x + dx + n) % n] > v) { max = false; break; }
    if (max) out.push(Math.round(Math.atan2(fk(y), fk(x)) * 180 / Math.PI));
  }
  return out.sort((a, b) => a - b);
}

async function loadCore() {
  const html = await (await fetch("../../blog/quasicrystal-sandbox.html",
                                  { cache: "no-store" })).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const src = ["qc-data", "qc-core"].map((id) =>
    doc.getElementById(id).textContent).join("\n;\n");
  return new Function(src + "\nreturn { QC, QCDATA };")();
}
let manifest;
async function ref(name) {
  const m = manifest[name];
  const buf = await (await fetch("ref/" + m.file, { cache: "no-store" })).arrayBuffer();
  return m.dtype === "uint8" ? new Uint8Array(buf) : new Float32Array(buf);
}

async function main() {
  const { QC, QCDATA } = await loadCore();
  window.QC = QC; window.QCDATA = QCDATA;
  manifest = await (await fetch("ref/manifest.json", { cache: "no-store" })).json();
  const canvas = document.createElement("canvas");
  const probe = QC.probeWebGL(canvas);
  check("WebGL2 with float render targets", probe.ok, probe.reason || "");
  if (!probe.ok) return;
  const gpu = new QC.GPU(probe.gl);
  window.gpu = gpu;

  // FFT on its own against numpy.fft.fft2.
  {
    const x = await ref("fft_in"), want = await ref("fft_out");
    const sim = new QC.QCSim(gpu, 128);
    sim.setField(x);
    const got = gpu.read(sim.t.rhoK, 1, true);
    let scale = 0;
    for (const v of want) scale = Math.max(scale, Math.abs(v));
    const e = maxAbs(got, want) / scale;
    check("GPU FFT matches numpy fft2 (n=128)", e <= 1e-5,
          `max rel err ${e.toExponential(2)}`);
    sim.dispose();
  }

  // 100 steps at T = 0 from the same start.
  for (const mode of ["overdamped", "inertial"]) {
    const m = manifest[`rho100_${mode}`];
    const sim = new QC.QCSim(gpu, 128, Math.PI / m.dx);
    sim.setParams({ eps: m.params.eps, c: m.params.c,
      qName: m.params.q_name, T: 0, dt: m.params.dt, mode,
      friction: m.params.friction });
    sim.setField(await ref(`rho0_${mode}`));
    sim.step(100);
    const got = sim.readField(), want = await ref(`rho100_${mode}`);
    const e = maxAbs(got, want);
    let amp = 0, drift = 0;
    const start = await ref(`rho0_${mode}`);
    for (let i = 0; i < want.length; i++) {
      amp = Math.max(amp, Math.abs(want[i]));
      drift = Math.max(drift, Math.abs(want[i] - start[i]));
    }
    check(`100 steps ${mode} match Python (n=128, k12 defaults)`, e <= 1e-4,
          `max |drho| ${e.toExponential(2)} (field max ${amp.toFixed(3)}, change over run ${drift.toFixed(3)})`);
    sim.dispose();
  }

  {
    const sim = new QC.QCSim(gpu, 128);
    sim.setParams({ T: 0 });           // Python's reference run is at T = 0
    sim.setField(await ref("rho0_qc"));
    sim.step(100);
    const want = await ref("rho100_qc"), e = maxAbs(sim.readField(), want);
    let amp = 0;
    for (const v of want) amp = Math.max(amp, Math.abs(v));
    check("100 steps from a quasicrystal seed match Python", e <= 1e-4,
          `max |drho| ${e.toExponential(2)} (field max ${amp.toFixed(3)})`);
    sim.dispose();
  }

  // The embedded phase diagrams decode to the Python labels.
  for (const name of Object.keys(QC.Q_PRESETS)) {
    const d = QCDATA.diagrams[name], want = await ref(`labels_${name}`);
    const got = QC.decodeLabels(d);
    const same = got.length === want.length && got.every((v, i) => v === want[i])
      && JSON.stringify(d.names) === JSON.stringify(manifest[`labels_${name}`].names);
    check(`embedded ${name} diagram equals Python's`, same, d.names.join(", "));
  }

  // Seeds: grid snapping, rotation search, amplitudes, half window.
  for (const [name, m] of Object.entries(manifest)) {
    if (!name.startsWith("seed_")) continue;
    const got = QC.makeSeed(m.kind, { n: m.n, dx: m.dx, eps: m.eps,
                                      qName: m.q_name, q: m.q });
    const e = maxAbs(got, await ref(name));
    check(`seed ${m.kind} ${m.q_name} n=${m.n} matches Python`, e <= 1e-5,
          `max err ${e.toExponential(2)}`);
  }

  // Band-limited resampling for grid and zoom changes.
  {
    const a = await ref("resample_in");
    const cases = [["resample_up", QC.fourierResample(a, 128, 256)],
                   ["resample_down", QC.fourierResample(a, 128, 64)],
                   ["resample_odd", QC.fourierResample(QC.wrapWindow(a, 128, 85), 85, 128)]];
    for (const [name, got] of cases) {
      const e = maxAbs(got, await ref(name));
      check(`${name} matches sim._fourier_resample`, e <= 1e-5,
            `max err ${e.toExponential(2)}`);
    }
  }

  // Rendering against colormaps.to_rgb and fourier_rgb.
  {
    const f = await ref("render_field"), m = manifest.render_field;
    const sim = new QC.QCSim(gpu, 128, Math.PI / m.dx);
    sim.setField(f);
    const view = new QC.QCView(gpu, sim, QCDATA.lut);
    const readRGB = (opts, size) => {
      const t = gpu.texture(size, size, "rgba8");
      view.draw(opts, t);
      const px = new Uint8Array(4 * size * size);
      gpu.gl.bindFramebuffer(gpu.gl.FRAMEBUFFER, t.fbo);
      gpu.gl.readPixels(0, 0, size, size, gpu.gl.RGBA, gpu.gl.UNSIGNED_BYTE, px);
      gpu.free(t);
      // readPixels row 0 is the bottom; image row 0 is the top.
      const rgb = new Uint8Array(3 * size * size);
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        for (let k = 0; k < 3; k++)
          rgb[3 * (y * size + x) + k] = px[4 * ((size - 1 - y) * size + x) + k];
      return rgb;
    };
    const compare = (got, want) => {
      let off = 0, worst = 0;
      for (let i = 0; i < want.length; i++) {
        const d = Math.abs(got[i] - want[i]);
        worst = Math.max(worst, d);
        if (d > 1) off++;
      }
      return { frac: off / want.length, worst };
    };
    const rm = manifest.render_rgb;
    let r = compare(readRGB({ cmap: rm.cmap, lo: rm.lo, hi: rm.hi }, 128),
                    await ref("render_rgb"));
    check("field colours match colormaps.to_rgb", r.frac <= 1e-3,
          `${(100 * r.frac).toFixed(3)} % of channels off by >1, worst ${r.worst}`);

    const Lp = view.logPower(), M = manifest.render_fourier.shape[0];
    const lp = gpu.read(Lp);
    const fmax = lp.reduce((a, b) => Math.max(a, b), 0);
    r = compare(readRGB({ cmap: "red-white-blue", fourier: true, fourierMax: fmax }, M),
                await ref("render_fourier"));
    check(`Fourier view matches colormaps.fourier_rgb (${M}x${M} crop)`,
          Lp.w === M && r.frac <= 1e-3,
          `crop ${Lp.w}, ${(100 * r.frac).toFixed(3)} % off by >1, worst ${r.worst}`);

    const p = QC.percentile(f.map(Math.abs), 99.5), want = manifest.render_p995;
    check("auto range percentile matches numpy", Math.abs(p - want) < 1e-6,
          `JS ${p}, Python ${want}`);

    const ar = new QC.AsyncRead(gpu);
    ar.start(sim.t.rho, 1);
    let got = null;
    for (let i = 0; i < 200 && !got; i++) {
      await new Promise((res) => setTimeout(res, 5));
      got = ar.poll();
    }
    check("async readback returns the field", got && maxAbs(got, f) === 0,
          got ? "" : "never completed");
    view.dispose(); sim.dispose();
  }

  // Hash RNG: xi ~ N(0, 1).  Read the noise term itself with eps = 0
  // on a flat field.
  {
    const n = 512, sim = new QC.QCSim(gpu, n);
    sim.setParams({ eps: 0, T: 0.01 });
    sim.setField(new Float32Array(n * n));
    const p = sim.params, amp = Math.sqrt(2 / p.dt) / sim.dx;
    gpu.run(gpu.progs.nonlin || (sim.step(0), gpu.progs.nonlin), sim.t.N, {
      u_rho: sim.t.rho, u_heat: sim.t.heat, u_eps: 0, u_T: p.T, u_amp: amp,
      u_noisy: 1, u_step: 12345, u_seed: 0 });
    const xi = gpu.read(sim.t.N).map((v) => v / (amp * Math.sqrt(p.T)));
    let mean = 0, v2 = 0;
    for (const v of xi) mean += v;
    mean /= xi.length;
    for (const v of xi) v2 += (v - mean) ** 2;
    v2 /= xi.length;
    check("hash RNG gives N(0,1) (512^2 cells)",
          Math.abs(mean) < 0.01 && Math.abs(v2 - 1) < 0.01,
          `mean ${mean.toFixed(4)}, var ${v2.toFixed(4)}`);

    const want = manifest.noise_step.var;
    sim.setField(new Float32Array(n * n));
    sim.step(1);
    const f = sim.readField();
    let m2 = 0, s2 = 0;
    for (const v of f) m2 += v;
    m2 /= f.length;
    for (const v of f) s2 += (v - m2) ** 2;
    s2 /= f.length;
    check("one noisy step has Python's variance (T=0.01, n=512)",
          Math.abs(s2 / want - 1) < 0.03,
          `JS ${s2.toExponential(3)}, Python ${want.toExponential(3)}`);
    sim.dispose();
  }

  // Behaviour at the page defaults (n = 512, bath T = 0.005): noise grows 12 peaks on each
  // ring, and a held brush melts a patch that then regrows.
  {
    const n = 512, sim = new QC.QCSim(gpu, n, 6, 1);
    sim.setField(QC.randomField(n, 7));
    for (let i = 0; i < 60; i++) sim.step(50);
    const inner = ringPeaks(QC, sim, 1), outer = ringPeaks(QC, sim, QC.Q_PRESETS.k12);
    const even = (a) => a.length === 12 && a.every((v, i) => i === 0 || Math.abs(v - a[i - 1] - 30) <= 2);
    check("random start grows a 12-fold pattern (3000 steps)", even(inner) && even(outer),
          `k=1: ${inner.join(" ")}; k=q: ${outer.join(" ")}`);
    const before = sim.readField();
    const win = (f, x0, y0) => { const o = []; for (let y = y0; y < y0 + 40; y++) for (let x = x0; x < x0 + 40; x++) o.push(f[y * n + x]); return o; };
    const corr = (a, b) => { const m = (v) => v.reduce((s, x) => s + x, 0) / v.length; const ma = m(a), mb = m(b); let sab = 0, saa = 0, sbb = 0; a.forEach((v, i) => { const x = v - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; }); return sab / Math.sqrt(saa * sbb); };
    // The frame loop at 60 fps, 8 steps a frame, default brush held 1 s.
    for (let fr = 0; fr < 60; fr++) { sim.addHeat(256, 256, 5 * (20 / 60), 24); sim.cool(Math.exp(-1 / 120)); sim.step(8); }
    const melted = corr(win(sim.readField(), 236, 236), win(before, 236, 236));
    const far = corr(win(sim.readField(), 20, 20), win(before, 20, 20));
    for (let fr = 0; fr < 600; fr++) { sim.cool(Math.exp(-1 / 120)); sim.step(8); }
    const regrown = corr(win(sim.readField(), 236, 236), win(before, 236, 236));
    check("a held brush melts locally and the patch regrows",
          melted < 0.5 && far > 0.95 && regrown > 0.8,
          `local corr ${melted.toFixed(2)} after 1 s, far ${far.toFixed(2)}, ${regrown.toFixed(2)} 10 s later`);
    sim.dispose();
  }

  // Every slider extreme, with full bath T and a full-strength brush,
  // stays finite and inside the clip.
  {
    const n = 128, sim = new QC.QCSim(gpu, n);
    let worst = "", ok = true;
    for (const eps of QC.EPS_RANGE) for (const lc of QC.LOGC_RANGE)
      for (const dt of QC.DT_RANGE) for (const mode of ["overdamped", "inertial"])
        for (const friction of QC.FRICTION_RANGE) {
          if (mode === "overdamped" && friction !== 1 && friction !== QC.FRICTION_RANGE[0]) continue;
          sim.setParams({ eps, c: 10 ** lc, dt, mode, friction, T: QC.T_RANGE[1] });
          sim.setField(QC.randomField(n, 3));
          for (let s = 0; s < 200; s++) {
            if (s % 10 === 0) sim.addHeat(64, 64, 20, 24);
            sim.step(1);
          }
          const f = sim.readField();
          let bad = false;
          for (const v of f) if (!Number.isFinite(v) || Math.abs(v) > 3) bad = true;
          if (bad) { ok = false; worst += ` eps=${eps} c=${10 ** lc} dt=${dt} ${mode} g=${friction};`; }
        }
    check("every slider extreme stays finite and within +-3 (200 steps)", ok,
          ok ? "" : worst);
    sim.dispose();
  }
}
main().catch((e) => { log("ERROR " + e.stack, "fail"); console.error(e); })
  .finally(() => { window.done = results; log("done"); });
</script>
</html>
