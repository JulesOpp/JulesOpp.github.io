<script id="qc-core">
// QC Sandbox core: a WebGL2 port of qcsandbox/sim.py, seeds.py and
// colormaps.py (github.com/JulesOpp, Quasicrystal, branch build/app).
// The Python is the reference; tools/quasicrystal/parity.html checks
// this file against fields it exported.
const QC = (function () {
"use strict";

// --- params --------------------------------------------------------------
const S = 2.0, RHO_MAX = 3.0;
const EPS_RANGE = [-0.15, 0.25], LOGC_RANGE = [-2, 2];
const DT_RANGE = [0.05, 2], T_RANGE = [0, 0.02];
const Q_CUSTOM_RANGE = [1, 2], FRICTION_RANGE = [0.05, 5];
// k_n = 2 cos(pi/n), in the order the q menu lists them.
const Q_PRESETS = {
  k12: Math.sqrt(2 + Math.sqrt(3)), k5: (1 + Math.sqrt(5)) / 2,
  k4: Math.SQRT2, k6: Math.sqrt(3), k1: 2, k8: Math.sqrt(2 + Math.SQRT2),
};
const Q_LABELS = {
  k12: "12-fold (dodecagonal)", k5: "10-fold (decagonal)",
  k4: "square superstructure", k6: "hexagonal superstructure",
  k1: "lamellar superstructure", k8: "8-fold (metastable only)",
  custom: "custom",
};
const DEFAULTS = { eps: 0.005, c: 10, qName: "k12", qCustom: 1.9, T: 0,
                   dt: 0.5, mode: "overdamped", friction: 1 };

const clamp = (v, lo, hi) => Math.min(Math.max(+v, lo), hi);

function clampParams(p) {
  const qName = p.qName in Q_PRESETS || p.qName === "custom"
    ? p.qName : "k12";
  return {
    eps: clamp(p.eps, ...EPS_RANGE),
    c: clamp(p.c, 10 ** LOGC_RANGE[0], 10 ** LOGC_RANGE[1]),
    qName, qCustom: clamp(p.qCustom, ...Q_CUSTOM_RANGE),
    T: clamp(p.T, ...T_RANGE), dt: clamp(p.dt, ...DT_RANGE),
    mode: p.mode === "inertial" ? "inertial" : "overdamped",
    friction: clamp(p.friction, ...FRICTION_RANGE),
  };
}
const qOf = (p) => p.qName === "custom" ? p.qCustom : Q_PRESETS[p.qName];

// Python's round(): half to even.  Seeds snap with it, and a
// half-up rounding would pick a different grid wavevector on a tie.
function roundHalfEven(x) {
  const r = Math.round(x);
  return Math.abs(x % 1) === 0.5 && r % 2 !== 0 ? r - 1 : r;
}

// --- gpu -------------------------------------------------------------------
function probeWebGL(canvas) {
  const gl = canvas.getContext("webgl2", {
    antialias: false, depth: false, stencil: false, alpha: false,
    preserveDrawingBuffer: true, powerPreference: "high-performance" });
  if (!gl) return { ok: false, reason: "This browser has no WebGL2." };
  if (!gl.getExtension("EXT_color_buffer_float"))
    return { gl, ok: false, reason:
      "This GPU cannot render to float textures, which the simulation needs." };
  return { gl, ok: true };
}

const VERT = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
out vec4 o;
`;

class GPU {
  constructor(gl) {
    this.gl = gl;
    this.vao = gl.createVertexArray();
    this.progs = {};
  }
  program(name, src) {
    if (this.progs[name]) return this.progs[name];
    const gl = this.gl;
    const sh = (type, s) => {
      const x = gl.createShader(type);
      gl.shaderSource(x, s);
      gl.compileShader(x);
      if (!gl.getShaderParameter(x, gl.COMPILE_STATUS))
        throw new Error(name + ": " + gl.getShaderInfoLog(x));
      return x;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, HEAD + src));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(name + ": " + gl.getProgramInfoLog(p));
    const u = {};
    const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(p, i);
      u[info.name] = { loc: gl.getUniformLocation(p, info.name),
                       type: info.type };
    }
    return (this.progs[name] = { p, u });
  }
  texture(w, h, fmt) {
    const gl = this.gl;
    const F = { rg: [gl.RG32F, gl.RG, gl.FLOAT],
                r: [gl.R32F, gl.RED, gl.FLOAT],
                rgba: [gl.RGBA32F, gl.RGBA, gl.FLOAT],
                rgba8: [gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE] }[fmt];
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, F[0], w, h);
    for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
      gl.texParameteri(gl.TEXTURE_2D, k, gl.NEAREST);
    for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T])
      gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                            gl.TEXTURE_2D, tex, 0);
    return { tex, fbo, w, h, fmt, F };
  }
  upload(t, data) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, t.w, t.h, t.F[1], t.F[2], data);
  }
  clear(t) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
  }
  free(t) {
    if (!t) return;
    this.gl.deleteTexture(t.tex);
    if (t.fbo) this.gl.deleteFramebuffer(t.fbo);
  }
  // Draw a full-screen triangle with `prog` into `target` (null = the
  // canvas).  Uniform types come from the linked program, so callers
  // pass plain numbers, arrays and textures.
  run(prog, target, uniforms, viewport) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
    if (viewport) gl.viewport(...viewport);
    else gl.viewport(0, 0, target.w, target.h);
    gl.useProgram(prog.p);
    let unit = 0;
    for (const [name, v] of Object.entries(uniforms)) {
      const u = prog.u[name];
      if (!u) continue;          // optimised away by the compiler
      switch (u.type) {
        case gl.SAMPLER_2D:
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, v.tex);
          gl.uniform1i(u.loc, unit++);
          break;
        case gl.FLOAT: gl.uniform1f(u.loc, v); break;
        case gl.INT: case gl.BOOL: gl.uniform1i(u.loc, +v); break;
        case gl.UNSIGNED_INT: gl.uniform1ui(u.loc, v >>> 0); break;
        case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
        case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;
        default: throw new Error("uniform type " + u.type);
      }
    }
    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // Synchronous read of channel 0 (and 1 with `both`) of a float
  // texture.  Reading R32F/RG32F directly is not guaranteed, so copy
  // into RGBA32F first.  `stride` reads every stride-th cell.
  read(t, stride = 1, both = false) {
    const gl = this.gl;
    const w = Math.ceil(t.w / stride), h = Math.ceil(t.h / stride);
    const tmp = this.texture(w, h, "rgba");
    this.run(this.program("copy", COPY_FS), tmp, { u_src: t, u_stride: stride });
    const px = new Float32Array(4 * w * h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, tmp.fbo);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, px);
    this.free(tmp);
    const out = new Float32Array((both ? 2 : 1) * w * h);
    if (both) for (let i = 0; i < w * h; i++) {
      out[2 * i] = px[4 * i]; out[2 * i + 1] = px[4 * i + 1];
    } else for (let i = 0; i < w * h; i++) out[i] = px[4 * i];
    return out;
  }
}

const COPY_FS = `
uniform sampler2D u_src; uniform int u_stride;
void main() { o = texelFetch(u_src, ivec2(gl_FragCoord.xy) * u_stride, 0); }`;

// --- fft -------------------------------------------------------------------
// One radix-2 Stockham pass along one axis.  u_tw holds
// exp(-2 pi i k / n), so twiddles are exact float64 values rounded
// once rather than float32 sin/cos evaluated on the GPU.
const FFT_FS = `
uniform sampler2D u_src, u_tw;
uniform int u_n, u_sub, u_axis, u_clip;
uniform float u_sign, u_scale;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  int j = u_axis == 0 ? c.x : c.y;
  int h = u_sub >> 1;
  int e = (j / u_sub) * h + (j % h);
  ivec2 ca = c, cb = c;
  if (u_axis == 0) { ca.x = e; cb.x = e + (u_n >> 1); }
  else { ca.y = e; cb.y = e + (u_n >> 1); }
  vec2 a = texelFetch(u_src, ca, 0).xy, b = texelFetch(u_src, cb, 0).xy;
  vec2 w = texelFetch(u_tw, ivec2((j % u_sub) * (u_n / u_sub), 0), 0).xy;
  w.y *= u_sign;
  vec2 r = (a + vec2(w.x * b.x - w.y * b.y, w.x * b.y + w.y * b.x)) * u_scale;
  if (u_clip == 1) r = vec2(clamp(r.x, -${RHO_MAX.toFixed(1)}, ${RHO_MAX.toFixed(1)}), 0.0);
  o = vec4(r, 0.0, 0.0);
}`;

// --- sim -------------------------------------------------------------------
// N = eps rho + rho^2 - rho^3 + amp sqrt(T) xi, xi ~ N(0, 1) from a
// hash of (cell, step, seed): no RNG state to carry between passes.
const NONLIN_FS = `
uniform sampler2D u_rho, u_heat;
uniform float u_eps, u_T, u_amp; uniform int u_noisy; uniform uint u_step, u_seed;
uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  float r = texelFetch(u_rho, c, 0).x;
  float N = u_eps * r + r * r - r * r * r;
  if (u_noisy == 1) {
    float T = texelFetch(u_heat, c, 0).x + u_T;
    uvec3 h = pcg3d(uvec3(uint(c.x), uint(c.y) ^ (u_seed << 16u), u_step));
    float u1 = (float(h.x >> 8u) + 1.0) / 16777216.0;
    float u2 = float(h.y >> 8u) / 16777216.0;
    N += u_amp * sqrt(T) * sqrt(-2.0 * log(u1)) * cos(6.283185307179586 * u2);
  }
  o = vec4(N, 0.0, 0.0, 0.0);
}`;

// The semi-implicit update per Fourier mode (sim.py step()).
const UPDATE_FS = `
uniform sampler2D u_rhoK, u_FN, u_vK;
uniform int u_n, u_inertial;
uniform float u_dk2, u_c, u_q2, u_dt, u_g;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  int kx = c.x <= u_n / 2 ? c.x : c.x - u_n;
  int ky = c.y <= u_n / 2 ? c.y : c.y - u_n;
  float k2 = float(kx * kx + ky * ky) * u_dk2;
  float P = (k2 - 1.0) * (k2 - u_q2);
  float K = u_c * P * P + ${S.toFixed(1)};
  vec2 rk = texelFetch(u_rhoK, c, 0).xy, fn = texelFetch(u_FN, c, 0).xy;
  float dt = u_dt;
  vec2 nk;
  if (u_inertial == 1) {
    vec2 vk = texelFetch(u_vK, c, 0).xy;
    nk = (rk * (1.0 + u_g * dt) + dt * vk + dt * dt * (fn + ${S.toFixed(1)} * rk))
       / (1.0 + u_g * dt + dt * dt * K);
  } else {
    nk = (rk * (1.0 + dt * ${S.toFixed(1)}) + dt * fn) / (1.0 + dt * K);
  }
  o = vec4(nk, 0.0, 0.0);
}`;

const VEL_FS = `
uniform sampler2D u_new, u_old; uniform float u_dt;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  o = vec4((texelFetch(u_new, c, 0).xy - texelFetch(u_old, c, 0).xy) / u_dt, 0.0, 0.0);
}`;

// Gaussian heat blob on the +-3 sigma window that sim.add_heat
// touches, wrapping round the periodic box.
const BRUSH_FS = `
uniform sampler2D u_heat;
uniform int u_n, u_w, u_rx, u_ry;
uniform float u_cx, u_cy, u_amp, u_sig2;
int wrap(int d) { return ((d + u_n / 2) % u_n + u_n) % u_n - u_n / 2; }
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  float h = texelFetch(u_heat, c, 0).x;
  int dx = wrap(c.x - u_rx), dy = wrap(c.y - u_ry);
  int lo = -(u_w / 2), hi = u_w - u_w / 2 - 1;
  if (dx >= lo && dx <= hi && dy >= lo && dy <= hi) {
    float fx = float(dx + u_rx) - u_cx, fy = float(dy + u_ry) - u_cy;
    h = max(h + u_amp * exp(-(fx * fx + fy * fy) / (2.0 * u_sig2)), 0.0);
  }
  o = vec4(h, 0.0, 0.0, 0.0);
}`;

const SCALE_FS = `
uniform sampler2D u_src; uniform float u_f;
void main() { o = texelFetch(u_src, ivec2(gl_FragCoord.xy), 0) * u_f; }`;

class QCSim {

// --- cpu fft and resampling ---------------------------------------------
// In-place complex FFT of any length (radix 2, Bluestein otherwise);

// --- seeds -------------------------------------------------------------------
// Wavevectors are snapped to the grid's own k's so every seed is
